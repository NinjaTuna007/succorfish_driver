# Profile: talk to the Teensy 4.1 front-end (OWTT timing / passthrough), which
# enumerates as a USB CDC ACM device at 115200 baud. The Teensy relays modem
# traffic; this bridge still treats it as a transparent line pipe.
/**:
  ros__parameters:
    profile: "teensy"
    # Where the bytes come from: "serial" (real port, default), "test"
    # (in-memory pretend modem -- no hardware) or "unity" (smarcUnity acoustic
    # bridge). Override on the CLI with backend:=test / backend:=unity.
    backend: "serial"
    serial:
      port: "/dev/ttyACM0"
      port_fallback: "/dev/ttyACM1"
      baudrate: 115200
      timeout: 1.0
    command_terminator: "\r\n"
    encoding: "utf-8"
    reconnect_delay_s: 2.0
    recent_lines_buffer: 200
    # Seconds to wait after a TX before the next one (0 = no extra spacing).
    # SendCommand still holds the TX session until its reply wait finishes.
    min_tx_gap_s: 0.0
    # "test" backend (only used when backend == "test"): a $Y<id><mode> config
    # is acked with #A<id>; optional stochastic faults for robustness testing.
    test:
      range_m: 100.0
      sound_velocity: 1500.0
      fault:
        drop_prob: 0.0
        garble_prob: 0.0
    # "unity" backend (only used when backend == "unity"): bridges the OWTT
    # broadcast loop. Each received packet yields a #B<id><nn><payload> frame and
    # a paired #I<delta_us> timing line (delta = ground-truth time of flight).
    unity:
      write_topic: "acoustic/write"
      read_topic: "acoustic/read"
      own_modem_id: "007"
      offset_us: 0.0
      id_width: 3
